name: Upstream Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream olcrtc
        run: |
          git clone --depth=50 https://github.com/openlibrecommunity/olcrtc.git /tmp/olcrtc-upstream

      - name: Compare config schemas
        id: compare
        run: |
          OUT="$(bash scripts/check-upstream-sync.sh /tmp/olcrtc-upstream "$PWD" 2>&1)" || STATUS=$?
          echo "$OUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "report<<EOF"
            echo "$OUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report drift via issue
        if: steps.compare.outputs.status == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT;
            const body = [
              'Upstream openlibrecommunity/olcrtc added schema fields the panel does not emit yet.',
              '',
              '```',
              report,
              '```',
              '',
              'Update `cmd/olcrtc-manager/main.go` (and `src/main.tsx` where needed) to cover the new fields, then re-run:',
              '',
              '```bash',
              'bash scripts/check-upstream-sync.sh',
              '```',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const title = 'Upstream schema drift detected';
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
        env:
          REPORT: ${{ steps.compare.outputs.report }}

      - name: Close issue when in sync
        if: steps.compare.outputs.status != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const title = 'Upstream schema drift detected';
            for (const issue of issues.data) {
              if (issue.title === title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }